name: Nota
# Paths in this spec are resolved relative to this file's directory (macos/).
# `xcodegen generate --spec macos/project.yml` writes macos/Nota.xcodeproj.
options:
  bundleIdPrefix: com.xiafawu
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

# Signing: app targets (Nota, NotaShare) use the stable self-signed
# "Nota Local Signing" identity (scripts/create-signing-cert.sh) so macOS TCC
# grants (Accessibility, Input Monitoring) survive rebuilds — an ad-hoc
# cdhash changes every build, and a debug copy sharing the bundle id with the
# deployed app would invalidate its grants on every Xcode Run. Test bundles
# stay ad-hoc ("-" below): they never touch TCC and must build without the
# local cert (e.g. worktree/CI checkouts).
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Nota:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Nota
        excludes:
          - "Info.plist"
          - "Dictation/Tests"
          - "UI/Tests"
          - "Assets/.gitignore"
          - "Assets/AppIcon.iconset"
          - "Assets/AppIcon.svg"
          - "Assets/AppIcon.icon"
      # Icon Composer document ("Quotation" concept): compiled by actool into
      # Assets.car; system renders glass, dark, and mono appearances from it.
      - path: Nota/Assets/AppIcon.icon
        buildPhase: resources
        type: file
    settings:
      base:
        INFOPLIST_FILE: Nota/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xiafawu.nota
        PRODUCT_NAME: Nota
        # Primary icon: AppIcon.icon (Icon Composer). AppIcon.icns kept as
        # CFBundleIconFile fallback for contexts that don't read Assets.car.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Deliberately no CODE_SIGN_ENTITLEMENTS: the main app is unsandboxed
        # for the production dictation distribution path. NotaShare remains
        # separately sandboxed below.
        CODE_SIGN_IDENTITY: "Nota Local Signing"
    dependencies:
      - target: NotaShare
        embed: true

  NotaShare:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: NotaShare
        excludes:
          - "Info.plist"
          - "NotaShare.entitlements"
    settings:
      base:
        INFOPLIST_FILE: NotaShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotaShare/NotaShare.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.xiafawu.nota.share
        PRODUCT_NAME: NotaShare
        CODE_SIGN_IDENTITY: "Nota Local Signing"

  NotaDictationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Nota/Dictation/Tests
    dependencies:
      - target: Nota
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiafawu.nota.dictation-tests
        GENERATE_INFOPLIST_FILE: YES
  NotaUITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Nota/UI/Tests
    dependencies:
      - target: Nota
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiafawu.nota.ui-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nota:
    build:
      targets:
        Nota: all
    test:
      targets:
        - name: NotaDictationTests
        - name: NotaUITests
    run:
      config: Debug
    archive:
      config: Release
